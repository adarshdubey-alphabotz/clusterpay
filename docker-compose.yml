version: '3.8'

# ─── ClusterPay Docker Compose ────────────────────────────────────────────────
# Before first run:
#   1. python scripts/generate_secrets.py   (generates admin keys + .env)
#   2. docker compose up -d

services:
  clusterpay-gateway:
    build: .
    container_name: clusterpay-gateway
    restart: always
    ports:
      - "8085:8085"
    env_file:
      - .env                        # Generated by scripts/generate_secrets.py
    environment:
      - HOST=0.0.0.0
      - PORT=8085
      - MONGO_URI=mongodb://cpay_user:P2uX3aNMVZ__NDRwmyoO7wCFWcdCK0Rw@clusterpay-mongo:27017/clusterpay_db?authSource=clusterpay_db
      - MONGO_DB_NAME=clusterpay_db
    volumes:
      - .:/app
    depends_on:
      - clusterpay-mongo
    networks:
      - clusterpay-network

  clusterpay-mongo:
    image: mongo:6.0
    container_name: clusterpay-mongo
    restart: always
    # MongoDB authentication enabled — database is NOT accessible without credentials
    env_file:
      - .env
    environment:
      - MONGO_INITDB_ROOT_USERNAME=cpay_admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=clusterpay_db
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    # MongoDB port NOT exposed to host — only accessible inside clusterpay-network
    networks:
      - clusterpay-network

  # ─── Optional: Redis for accurate multi-worker rate limiting ───────────────
  # Uncomment to enable. Then set REDIS_URL=redis://clusterpay-redis:6379 above.
  # clusterpay-redis:
  #   image: redis:7-alpine
  #   container_name: clusterpay-redis
  #   restart: always
  #   command: redis-server --save 60 1 --loglevel warning
  #   volumes:
  #     - redis_data:/data
  #   networks:
  #     - clusterpay-network

volumes:
  mongo_data:
  # redis_data:

networks:
  clusterpay-network:
    driver: bridge
