<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Merchant Store · ClusterPay 1-Line Embedded Modal</title>
  <script src="https://pay.rapidx.me/js/v1/clusterpay.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
    .card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); text-align: center; }
    button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Pro Membership · $15.00</h2>
    <p>Pay with USDT, TON, LTC, BTC, or Polygon</p>
    <button onclick="openCheckout()">⚡ Pay with ClusterPay</button>
    <div id="checkout-modal" style="margin-top: 20px;"></div>
  </div>

  <script>
    function openCheckout() {
      // In production, fetch session_id from your backend API
      const sessionId = 'YOUR_SESSION_ID_FROM_BACKEND';
      const cp = ClusterPay();
      cp.mount('#checkout-modal', {
        session_id: sessionId,
        height: 600,
        onSuccess: (data) => {
          alert('🎉 Payment Confirmed! Access granted.');
        }
      });
    }
  </script>
</body>
</html>
