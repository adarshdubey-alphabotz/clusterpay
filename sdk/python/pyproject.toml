[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clusterpay"
version = "2.1.0"
description = "Official Python SDK for ClusterPay - Non-Custodial Cryptocurrency Payment Gateway"
readme = "README.md"
authors = [{ name = "ClusterPay", email = "adarsh@clusterpay.cloud" }]
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Financial :: Point-Of-Sale",
]
dependencies = [
    "httpx>=0.24.0",
]

[project.urls]
Homepage = "https://clusterpay.cloud"
Documentation = "https://clusterpay.cloud/docs"
Repository = "https://github.com/adarshdubey-alphabotz/clusterpay"
"Issue Tracker" = "https://github.com/adarshdubey-alphabotz/clusterpay/issues"
